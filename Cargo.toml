[workspace]
resolver = "2"
members = [
    "core/yohu-protocol",
    "core/yohu-runtime",
    "core/yohu-domain",
    "core/yohu-md-convert",
    "core/yohu-md-huawei",
    "core/yohu-md-github",
    "core/yohu-source",
    "core/yohu-library",
    "core/yohu-ai",
    "app/yohu-docpreview",
    "app/yohu-ai-cli",
    "app/yohu-docs-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
tokio-util = "0.7"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }



[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"